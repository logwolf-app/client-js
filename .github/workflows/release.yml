name: Publish to npm

on:
  release:
    types: [created]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: the job trades a GitHub OIDC token for a
      # short-lived publish token, so no NPM_TOKEN secret is needed.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      # pnpm publish takes the version from package.json, whatever the release
      # is called; a release tagged v2.0.1 on a package still at 2.0.0 would
      # publish 2.0.0. The two must agree.
      - name: check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release $TAG does not match package.json ($VERSION)"
            exit 1
          fi
      # A published version cannot be taken back: test before, not after.
      - name: typecheck
        run: pnpm exec tsc --noEmit
      - name: test
        run: pnpm exec vitest run
      # A release checks out its tag, a detached HEAD, which pnpm's
      # publish-branch check would refuse. pnpm authenticates through the
      # trusted publisher configured for this workflow on npmjs.com; setup-node
      # gets no registry-url, so no token in .npmrc competes with it.
      - name: publish
        run: pnpm publish --access public --no-git-checks --provenance
